<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leaderboard — Zero-Trust OT Lab</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#141b25; --border:#26303d; --txt:#e6edf3; --muted:#8b949e;
    --gold:#fbbf24; --silver:#d1d5db; --bronze:#d97706;
    --ok:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
  header{padding:20px;border-bottom:1px solid var(--border);background:var(--panel)}
  header h1{margin:0;font-size:24px}
  .medal{font-size:28px;margin-right:10px}
  .container{max-width:1200px;margin:0 auto;padding:20px}

  .tabs{display:flex;gap:10px;margin:20px 0;border-bottom:1px solid var(--border);padding-bottom:10px}
  .tabs button{background:none;border:none;color:var(--muted);cursor:pointer;padding:10px 16px;
    font-size:14px;border-bottom:2px solid transparent;transition:.2s}
  .tabs button.active{color:var(--txt);border-bottom-color:#3b82f6}

  .leaderboard{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .rank-row{display:grid;grid-template-columns:60px 1fr 80px 80px 80px;gap:16px;
    padding:16px 20px;align-items:center;border-bottom:1px solid var(--border);
    transition:background .2s}
  .rank-row:hover{background:rgba(59,130,246,.1)}
  .rank-row:last-child{border-bottom:none}

  .rank{font-size:18px;font-weight:700;text-align:center}
  .rank.gold{color:var(--gold)}
  .rank.silver{color:var(--silver)}
  .rank.bronze{color:var(--bronze)}

  .student-info{display:flex;align-items:center;gap:12px;min-width:0}
  .student-badge{width:40px;height:40px;border-radius:50%;background:var(--border);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
    flex-shrink:0}
  .student-details{min-width:0}
  .student-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .student-group{font-size:12px;color:var(--muted)}

  .score-cell{text-align:center;font-weight:600}
  .score-cell.perfect{color:var(--ok)}

  .time-cell{text-align:center;font-size:13px;color:var(--muted)}

  .status{display:flex;align-items:center;gap:4px;font-size:12px}
  .status.submitted{color:var(--ok)}
  .status.in-progress{color:var(--warn)}

  .empty{text-align:center;padding:40px 20px;color:var(--muted)}

  @media(max-width:768px){
    .rank-row{grid-template-columns:1fr}
    .rank-row{gap:8px;padding:12px 16px}
    .student-info,.score-cell,.time-cell,.status{display:block}
    .rank{margin-bottom:8px}
  }

  .back-btn{display:inline-block;margin-bottom:20px;padding:8px 16px;
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    color:var(--txt);text-decoration:none;cursor:pointer;font-size:14px;transition:.2s}
  .back-btn:hover{border-color:#3b82f6;color:#3b82f6}
</style>
</head>
<body>
<header>
  <h1>🏆 Leaderboard Zero-Trust OT Lab</h1>
</header>

<div class="container">
  <a href="/" class="back-btn">← Retour</a>

  <div class="tabs">
    <button class="active" data-sort="score">🎯 Par Score</button>
    <button data-sort="time">⏱️ Par Temps</button>
  </div>

  <div class="leaderboard" id="leaderboard"></div>
</div>

<script>
const MEDALS = ['🥇', '🥈', '🥉'];
let allStudents = [];

async function loadLeaderboard(){
  try {
    const res = await fetch('/leaderboard.json');
    if(!res.ok) throw new Error('Erreur chargement');
    allStudents = await res.json();
    render('score');
  } catch(e) {
    document.getElementById('leaderboard').innerHTML =
      `<div class="empty">❌ Erreur: ${e.message}</div>`;
  }
}

function render(sortBy){
  const container = document.getElementById('leaderboard');

  let sorted = [...allStudents];
  if(sortBy === 'score'){
    sorted.sort((a, b) => {
      const diff = b.score - a.score;
      if(diff !== 0) return diff;
      return (a.submitted_at || '~').localeCompare(b.submitted_at || '~');
    });
  } else {
    sorted = sorted.filter(s => s.submitted_at);
    sorted.sort((a, b) => a.submitted_at.localeCompare(b.submitted_at));
  }

  if(!sorted.length){
    container.innerHTML = '<div class="empty">Pas de données yet</div>';
    return;
  }

  container.innerHTML = sorted.map((s, i) => {
    const rank = i + 1;
    const medal = MEDALS[i] || '💫';
    const rankClass = rank <= 3 ? ['gold','silver','bronze'][rank-1] : '';
    const badge = s.name.charAt(0).toUpperCase();
    const status = s.submitted_at
      ? `<span class="status submitted">✓ Soumis</span>`
      : `<span class="status in-progress">⏳ En cours</span>`;

    return `
      <div class="rank-row">
        <div class="rank ${rankClass}">${medal}</div>
        <div class="student-info">
          <div class="student-badge">${badge}</div>
          <div class="student-details">
            <div class="student-name">${s.name}</div>
            <div class="student-group">${s.group || 'N/A'}</div>
          </div>
        </div>
        <div class="score-cell ${s.score === 100 ? 'perfect' : ''}">
          ${s.score} / 100
        </div>
        <div class="time-cell">${s.submitted_at ? s.submitted_at.substring(11, 16) : '—'}</div>
        <div class="status">${status.replace(/^<span/, '').replace(/<\/span>$/, '')}</div>
      </div>
    `;
  }).join('');
}

document.querySelectorAll('.tabs button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.sort);
  });
});

loadLeaderboard();
setInterval(loadLeaderboard, 5000);
</script>
</body>
</html>
